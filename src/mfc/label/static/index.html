<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>malayalam-factcheck-corpus / labeller</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>malayalam-factcheck-corpus</strong>
        <span class="muted">manual labeller</span>
      </div>
      <div class="header-right">
        <div id="distribution" class="distribution" aria-label="verdict distribution"></div>
        <div class="progress">
          <span id="position">0 / 0</span>
          <span class="muted">·</span>
          <span id="labelled-count">0 labelled</span>
        </div>
      </div>
    </header>

    <nav class="filters">
      <label>
        Source
        <select id="filter-source"><option value="">all</option></select>
      </label>
      <label>
        Show
        <select id="filter-status">
          <option value="all">all</option>
          <option value="unlabelled" selected>unlabelled only</option>
          <option value="labelled">labelled only</option>
          <option value="unknown">auto-verdict = unknown</option>
        </select>
      </label>
      <label>
        Script
        <select id="filter-script">
          <option value="">any</option>
          <option value="mlym">mlym</option>
          <option value="latn">latn</option>
          <option value="mixed">mixed</option>
          <option value="unknown">unknown</option>
        </select>
      </label>
      <label>
        Manual verdict
        <select id="filter-verdict">
          <option value="">any</option>
          <option value="false">false</option>
          <option value="misleading">misleading</option>
          <option value="partly_false">partly_false</option>
          <option value="true">true</option>
          <option value="unverified">unverified</option>
          <option value="satire">satire</option>
          <option value="needs_review">needs_review</option>
          <option value="not_fact_check">not_fact_check</option>
        </select>
      </label>
      <button id="btn-reload" type="button">reload</button>
    </nav>

    <main id="card" class="card">
      <p class="muted">loading…</p>
    </main>

    <section class="verdicts" id="verdicts" hidden>
      <button data-verdict="false" data-letter="f" class="v-false">
        <span class="vname">false</span>
        <span class="vkeys"><kbd>f</kbd><kbd>1</kbd></span>
      </button>
      <button data-verdict="misleading" data-letter="m" class="v-misleading">
        <span class="vname">misleading</span>
        <span class="vkeys"><kbd>m</kbd><kbd>2</kbd></span>
      </button>
      <button data-verdict="partly_false" data-letter="p" class="v-partly">
        <span class="vname">partly_false</span>
        <span class="vkeys"><kbd>p</kbd><kbd>3</kbd></span>
      </button>
      <button data-verdict="true" data-letter="t" class="v-true">
        <span class="vname">true</span>
        <span class="vkeys"><kbd>t</kbd><kbd>4</kbd></span>
      </button>
      <button data-verdict="unverified" data-letter="v" class="v-unverified">
        <span class="vname">unverified</span>
        <span class="vkeys"><kbd>v</kbd><kbd>5</kbd></span>
      </button>
      <button data-verdict="satire" data-letter="s" class="v-satire">
        <span class="vname">satire</span>
        <span class="vkeys"><kbd>s</kbd><kbd>6</kbd></span>
      </button>
      <button data-verdict="needs_review" data-letter="r" class="v-review">
        <span class="vname">needs_review</span>
        <span class="vkeys"><kbd>r</kbd><kbd>7</kbd></span>
      </button>
      <button data-verdict="not_fact_check" data-letter="x" class="v-not-fc">
        <span class="vname">not_fact_check</span>
        <span class="vkeys"><kbd>x</kbd><kbd>8</kbd></span>
      </button>
      <button data-verdict="__delete__" class="v-clear">
        <span class="vname">clear</span>
        <span class="vkeys"><kbd>0</kbd></span>
      </button>
    </section>

    <section class="notes-row" id="notes-row" hidden>
      <textarea
        id="notes"
        placeholder="optional notes (saved with the next verdict click)"
        rows="2"
      ></textarea>
    </section>

    <footer class="hints" id="hints" hidden>
      <span><kbd>↵</kbd> accept suggested</span>
      <span><kbd>←</kbd> / <kbd>→</kbd> navigate</span>
      <span><kbd>n</kbd> next unlabelled</span>
      <span><kbd>u</kbd> undo last</span>
      <span><kbd>o</kbd> open article</span>
      <span><kbd>e</kbd> expand evidence</span>
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
