[project]
name = "malayalam-factcheck-corpus"
version = "0.1.0"
description = "Batch pipeline that turns Malayalam fact-check articles into a versioned Parquet corpus for ML training."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hrishikesh Bhaskaran", email = "hello@stultus.in" }]
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "extruct>=0.17",
    "trafilatura>=1.12",
    "polars>=1.7",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "loguru>=0.7",
    "tenacity>=9.0",
    "dateparser>=1.2",
    "hishel[async]>=1.0",
    "sentence-transformers>=3.0",
]

[project.scripts]
mfc = "mfc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "vcrpy>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "SIM",           # flake8-simplify
    "C4",            # flake8-comprehensions
    "RET",           # flake8-return
    "RUF",           # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "extruct.*",
    "trafilatura.*",
    "selectolax.*",
    "vcr.*",
    "dateparser.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
